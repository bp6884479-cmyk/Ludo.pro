&lt;script&gt;
const $=s=&gt;document.querySelector(s);
const P=&quot;6,1 6,2 6,3 6,4 6,5 5,6 4,6 3,6 2,6 1,6 0,6 0,7 0,8 1,8 2,8 3,8 4,8 5,8 6,9 6,10 6,11 6,12 6,13 6,14 7,14 8,14 8,13 8,12 8,11 8,10 8,9 9,8 10,8 11,8 12,8 13,8 14,8 14,7 14,6 13,6 12,6 11,6 10,6 9,6 8,5 8,4 8,3 8,2 8,1 8,0 7,0 6,0&quot;.split(&quot; &quot;).map(s=&gt;s.split(&quot;,&quot;).map(Number));
const SAFE=new Set([0,8,13,21,26,34,39,47]);
// token progress: -1 yard, 0..50 track, 51..55 home column, 56 = ghar pahunch gaya
// Clockwise order: Green(top-left) -&gt; Yellow(top-right) -&gt; Blue(bottom-right) -&gt; Red(bottom-left)
const PL=[
 {n:&quot;Green&quot;,k:&quot;G&quot;,s:0,y:[[2,2],[4,2],[2,4],[4,4]],h:p=&gt;[7,p-50],f:i=&gt;[6.8,6.75+i*.5]},
 {n:&quot;Yellow&quot;,k:&quot;Y&quot;,s:13,y:[[11,2],[13,2],[11,4],[13,4]],h:p=&gt;[p-50,7],f:i=&gt;[6.75+i*.5,6.8]},
 {n:&quot;Blue&quot;,k:&quot;B&quot;,s:26,y:[[11,11],[13,11],[11,13],[13,13]],h:p=&gt;[7,64-p],f:i=&gt;[8.2,6.75+i*.5]},
 {n:&quot;Red&quot;,k:&quot;R&quot;,s:39,y:[[2,11],[4,11],[2,13],[4,13]],h:p=&gt;[64-p,7],f:i=&gt;[6.75+i*.5,8.2]}
];

// ---------- Board ----------
const B=$(&quot;#board&quot;),track=new Map(P.map((q,i)=&gt;[q+&quot;&quot;,i]));
const hc={},st={&quot;6,1&quot;:&quot;G&quot;,&quot;1,8&quot;:&quot;Y&quot;,&quot;8,13&quot;:&quot;B&quot;,&quot;13,6&quot;:&quot;R&quot;};
const ar={&quot;7,0&quot;:[&quot;→&quot;,&quot;G&quot;],&quot;0,7&quot;:[&quot;↓&quot;,&quot;Y&quot;],&quot;7,14&quot;:[&quot;←&quot;,&quot;B&quot;],&quot;14,7&quot;:[&quot;↑&quot;,&quot;R&quot;]};
for(let i=1;i&lt;=5;i++){hc[&quot;7,&quot;+i]=&quot;G&quot;;hc[i+&quot;,7&quot;]=&quot;Y&quot;;hc[&quot;7,&quot;+(14-i)]=&quot;B&quot;;hc[(14-i)+&quot;,7&quot;]=&quot;R&quot;}
for(let r=0;r&lt;15;r++)for(let c=0;c&lt;15;c++){
  const d=document.createElement(&quot;div&quot;),k=r+&quot;,&quot;+c;d.className=&quot;c&quot;;
  const yc=r&lt;6&amp;&amp;c&lt;6?&quot;G&quot;:r&lt;6&amp;&amp;c&gt;8?&quot;Y&quot;:r&gt;8&amp;&amp;c&gt;8?&quot;B&quot;:r&gt;8&amp;&amp;c&lt;6?&quot;R&quot;:&quot;&quot;;
  if(yc)d.className+=&quot; y &quot;+yc;
  else if(r&gt;5&amp;&amp;r&lt;9&amp;&amp;c&gt;5&amp;&amp;c&lt;9)d.className+=&quot; n&quot;;
  else if(hc[k]||st[k])d.className+=&quot; k &quot;+(hc[k]||st[k]);
  else if(ar[k]){d.className+=&quot; a &quot;+ar[k][1];d.textContent=ar[k][0]}
  else if(SAFE.has(track.get(k)))d.textContent=&quot;★&quot;;
  B.appendChild(d);
}
const add=(c,css,txt)=&gt;{const e=document.createElement(&quot;div&quot;);e.className=c;Object.assign(e.style,css);if(txt)e.textContent=txt;B.appendChild(e);return e};
const pc=v=&gt;v/15*100+&quot;%&quot;;
[[&quot;G&quot;,0,0],[&quot;Y&quot;,9,0],[&quot;B&quot;,9,9],[&quot;R&quot;,0,9]].forEach(([k,x,y])=&gt;{
  add(&quot;yb&quot;,{left:pc(x+1),top:pc(y+1)});
  [2,4].forEach(dx=&gt;[2,4].forEach(dy=&gt;add(&quot;slot &quot;+k,{left:pc(x+dx),top:pc(y+dy)})));
  add(&quot;lb&quot;,{left:pc(x+1.5),top:pc(y&lt;5?y+.15:y+5.2),color:&quot;#fff&quot;},PL.find(p=&gt;p.k===k).n);
});
add(&quot;ctr&quot;,{});

// ---------- Panels + dice (har color ka dice uske apne corner ke paas) ----------
const PIPS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const DE=[],PN=[];
PL.forEach((pl,a)=&gt;{
  const left=pl.k===&quot;G&quot;||pl.k===&quot;R&quot;,p=document.createElement(&quot;div&quot;);
  p.className=&quot;pnl &quot;+pl.k;p.style.order=left?0:1;
  p.innerHTML=left?&#x27;&lt;i class=&quot;pin av&quot;&gt;&lt;/i&gt;&lt;button class=&quot;dice&quot;&gt;&lt;/button&gt;&lt;b class=&quot;arr&quot;&gt;◀&lt;/b&gt;&#x27;:&#x27;&lt;b class=&quot;arr&quot;&gt;▶&lt;/b&gt;&lt;button class=&quot;dice&quot;&gt;&lt;/button&gt;&lt;i class=&quot;pin av&quot;&gt;&lt;/i&gt;&#x27;;
  $(pl.k===&quot;G&quot;||pl.k===&quot;Y&quot;?&quot;#top&quot;:&quot;#bot&quot;).appendChild(p);
  const d=p.querySelector(&quot;.dice&quot;);d.innerHTML=&quot;&lt;i&gt;&lt;/i&gt;&quot;.repeat(9);d.onclick=()=&gt;a===turn&amp;&amp;roll();
  DE.push(d);PN.push(p);
});
const face=(a,n)=&gt;[...DE[a].children].forEach((e,i)=&gt;e.className=PIPS[n].includes(i)?&quot;on&quot;:&quot;&quot;);

// ---------- Tokens (pin shape) ----------
const E=PL.map((pl,a)=&gt;[0,1,2,3].map(i=&gt;{
  const e=document.createElement(&quot;div&quot;);e.className=&quot;pin tk &quot;+pl.k;
  e.onclick=()=&gt;a===turn&amp;&amp;move(i);B.appendChild(e);return e;
}));

// ---------- Game state ----------
let T,turn,D,rolled,over,busy,act,N=4;
const msg=t=&gt;$(&quot;#msg&quot;).textContent=t;
const movable=()=&gt;T[turn].map((t,i)=&gt;(t&lt;0?D===6:t+D&lt;=56)?i:-1).filter(i=&gt;i&gt;=0);
const next=()=&gt;{do turn=(turn+1)%4;while(!act[turn])};

function init(n){
  if(n)N=n;
  act=N===2?[1,0,1,0]:N===3?[1,1,1,0]:[1,1,1,1];   // 2 players: Green vs Blue
  T=PL.map(()=&gt;[-1,-1,-1,-1]);turn=0;D=0;rolled=false;over=false;busy=false;
  $(&quot;#win&quot;).hidden=true;
  PL.forEach((_,a)=&gt;{face(a,1);PN[a].classList.toggle(&quot;off&quot;,!act[a]);E[a].forEach(e=&gt;e.style.display=act[a]?&quot;&quot;:&quot;none&quot;)});
  document.querySelectorAll(&quot;[data-n]&quot;).forEach(b=&gt;b.classList.toggle(&quot;sel&quot;,+b.dataset.n===N));
  msg(&quot;Green ki baari — apne dice par click karo. Token nikalne ke liye 6 chahiye.&quot;);ui();render();
}

function render(){
  const mv=rolled&amp;&amp;!over&amp;&amp;!busy?movable():[],g={},L=[];
  PL.forEach((pl,a)=&gt;{if(!act[a])return;T[a].forEach((t,i)=&gt;{
    let x,y;
    if(t&lt;0)[x,y]=pl.y[i];
    else if(t===56)[x,y]=pl.f(i);
    else{const q=t&lt;=50?P[(pl.s+t)%52]:pl.h(t);x=q[1]+.5;y=q[0]+.5}
    const e=E[a][i];
    e.classList.toggle(&quot;done&quot;,t===56);
    e.classList.toggle(&quot;can&quot;,a===turn&amp;&amp;mv.includes(i));
    const o={e,x,y};L.push(o);
    if(t&gt;=0&amp;&amp;t&lt;56)(g[x+&quot;,&quot;+y]=g[x+&quot;,&quot;+y]||[]).push(o);
  })});
  for(const k in g){const n=g[k].length;g[k].forEach((o,j)=&gt;o.x+=(j-(n-1)/2)*.32)}
  L.forEach(o=&gt;{o.e.style.left=pc(o.x);o.e.style.top=pc(o.y)});
}

function ui(){
  PL.forEach((_,a)=&gt;{
    PN[a].classList.toggle(&quot;on&quot;,act[a]&amp;&amp;a===turn&amp;&amp;!over);
    DE[a].disabled=!(a===turn&amp;&amp;!rolled&amp;&amp;!over&amp;&amp;!busy);
  });
}

function rollValue(){
  // sabke liye same rule: 6 ki chance zyada (28%), aur agar koi token bahar nahi hai to aur zyada (42%)
  const none=T[turn].every(t=&gt;t&lt;0);
  if(Math.random()&lt;(none?.42:.28))return 6;
  return 1+Math.floor(Math.random()*5);
}
function roll(){
  if(rolled||over||busy)return;
  busy=true;ui();const dc=DE[turn],a=turn;dc.classList.add(&quot;roll&quot;);let n=0;
  const iv=setInterval(()=&gt;{
    face(a,1+Math.floor(Math.random()*6));            // dice animation
    if(++n&gt;9){clearInterval(iv);dc.classList.remove(&quot;roll&quot;);D=rollValue();face(a,D);after()}
  },70);
}

function after(){
  busy=false;rolled=true;
  if(!movable().length){
    busy=true;msg(`${PL[turn].n}: ${D} aaya, par koi token chal nahi sakta. Baari badal rahi hai...`);ui();
    setTimeout(()=&gt;{busy=false;rolled=false;next();msg(`${PL[turn].n} ki baari — apna dice roll karo`);ui();render()},1300);
    return;
  }
  msg(`${D} aaya! Uchhalte hue token par click karo.`);ui();render();
}

function move(i){
  if(!rolled||over||busy||!movable().includes(i))return;
  let t=T[turn][i];t=t&lt;0?0:t+D;T[turn][i]=t;
  let cap=false;
  if(t&lt;=50){                                           // capture check (safe cells par nahi)
    const idx=(PL[turn].s+t)%52;
    if(!SAFE.has(idx))PL.forEach((o,b)=&gt;{
      if(b===turn||!act[b])return;
      T[b].forEach((q,j)=&gt;{if(q&gt;=0&amp;&amp;q&lt;=50&amp;&amp;(o.s+q)%52===idx){T[b][j]=-1;cap=true}});
    });
  }
  rolled=false;
  if(T[turn].every(q=&gt;q===56)){
    over=true;render();ui();
    $(&quot;#wt&quot;).textContent=`🎉 ${PL[turn].n} jeet gaya!`;$(&quot;#win&quot;).hidden=false;return;
  }
  const extra=D===6||cap||t===56;
  if(!extra)next();
  msg((cap?&quot;Capture! &quot;:&quot;&quot;)+(extra?`${PL[turn].n} ko dobara chance — dice roll karo`:`${PL[turn].n} ki baari — apna dice roll karo`));
  render();ui();
}

document.querySelectorAll(&quot;[data-n]&quot;).forEach(b=&gt;b.onclick=()=&gt;init(+b.dataset.n));
$(&quot;#rs&quot;).onclick=$(&quot;#again&quot;).onclick=()=&gt;init();
init(4);
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
</div>

<script>
/* ===== Settings ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDFGtCMHWBH9ScOk2YUhk5iJjyh4ug9QSc",
  authDomain: "coinrush-pro-ef37b.firebaseapp.com",
  databaseURL: "https://coinrush-pro-ef37b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "coinrush-pro-ef37b",
  storageBucket: "coinrush-pro-ef37b.firebasestorage.app",
  messagingSenderId: "2523681309",
  appId: "1:2523681309:web:9bf3bf9164d948010cecf4"
};

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const AVATAR = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84"><rect width="84" height="84" fill="#fff"/><circle cx="42" cy="32" r="14" fill="#1f8fe5"/><path d="M14 78c0-18 12-26 28-26s28 8 28 26z" fill="#1f8fe5"/></svg>');
const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
const ERR = {
  "auth/popup-closed-by-user": "The sign-in window was closed. Please try again.",
  "auth/cancelled-popup-request": "The sign-in window was closed. Please try again.",
  "auth/popup-blocked": "Your browser blocked the popup. Allow popups and try again.",
  "auth/unauthorized-domain": "This domain is not authorized in Firebase (Authentication > Settings > Authorized domains).",
  "auth/operation-not-allowed": "This sign-in method is not enabled in Firebase Console (Google / Anonymous).",
  "auth/network-request-failed": "Network error. Check your internet and try again.",
  "auth/operation-not-supported-in-this-environment": "Open this page over http(s) or localhost, not file://."
};
const showErr = e => {
  const m = String(e && e.message || "");
  $("#err").textContent = ERR[e && e.code] ||
    (/permission_denied/i.test(m) ? "Database write denied. Check your Realtime Database rules." : "Login failed: " + ((e && e.code) || m));
};
const setBusy = b => { $("#bg").disabled = $("#bq").disabled = b; if (b) $("#err").textContent = ""; };

/* ===== Load Firebase (dynamic import so the buttons always work) ===== */
let fb = null, signingIn = false;
const CDN = "https://www.gstatic.com/firebasejs/10.12.2/";
const ready = (async () => {
  try {
    const [a, au, d] = await Promise.all([
      import(CDN + "firebase-app.js"),
      import(CDN + "firebase-auth.js"),
      import(CDN + "firebase-database.js")
    ]);
    const app = a.initializeApp(firebaseConfig);
    fb = { au, d, auth: au.getAuth(app), db: d.getDatabase(app) };
    au.onAuthStateChanged(fb.auth, onAuth);
  } catch (e) {
    console.warn("Firebase could not load, using demo mode:", e);
    $("#demo").hidden = false;
    const u = ls.get("user");
    if (u && String(u.uid).startsWith("demo_")) showHome(u, true);
  }
})();

/* ===== Save user in Realtime Database: users/{uid} ===== */
async function saveUser(u) {
  const guest = u.isAnonymous;
  const name = guest ? "Guest_" + u.uid.slice(-4).toUpperCase() : (u.displayName || "Player");
  const photo = (!guest && u.photoURL) || AVATAR;
  const r = fb.d.ref(fb.db, "users/" + u.uid);
  // Transaction: creates the user with coins=500, wins=0 only the first time; existing coins/wins are kept.
  const res = await fb.d.runTransaction(r, cur =>
    cur ? { ...cur, uid: u.uid, name, photo }
        : { uid: u.uid, name, photo, coins: 500, wins: 0 });
  return { ...res.snapshot.val(), isGuest: guest };
}
const finish = async u => {
  const data = await saveUser(u);
  ls.set("user", data);                    // save to localStorage
  showHome(data);                          // stay on this page: show the home screen
};

/* ===== Buttons ===== */
async function login(kind) {
  setBusy(true);
  await ready;
  if (!fb) { demoLogin(kind); setBusy(false); return; }
  signingIn = true;
  try {
    const cred = kind === "google"
      ? await fb.au.signInWithPopup(fb.auth, new fb.au.GoogleAuthProvider())
      : await fb.au.signInAnonymously(fb.auth);
    await finish(cred.user);
    signingIn = false; setBusy(false);
  } catch (e) {
    console.error(e); signingIn = false; showErr(e); setBusy(false);
  }
}
$("#bg").onclick = () => login("google");
$("#bq").onclick = () => login("guest");
$("#lo").onclick = async () => {
  ls.del("user");
  if (fb) { try { await fb.au.signOut(fb.auth); } catch (e) {} }
  $("#home").hidden = true; $("#login").hidden = false; setBusy(false);
};
$("#go").onclick = () => {                  // open the game on the same page (no redirect)
  const u = ls.get("user") || {};
  $("#gname").textContent = (u.name || "Player") + "  \u00b7  \ud83e\ude99 " + (u.coins ?? 500) + "  \u00b7  \ud83c\udfc6 " + (u.wins ?? 0);
  $("#game").hidden = false;
};
$("#back").onclick = () => { $("#game").hidden = true; };

/* ===== Already signed in (returning visitor) ===== */
function onAuth(u) {
  if (signingIn || !u) return;
  finish(u).catch(e => { console.error(e); showErr(e); });
}
function showHome(u, demo) {
  $("#login").hidden = true; $("#home").hidden = false;
  $("#nm").textContent = "Welcome, " + u.name + "!";
  $("#av").src = u.photo || AVATAR;
  $("#ty").textContent = u.isGuest ? "Playing as Guest" : "Signed in with Google";
  $("#st").textContent = "\ud83e\ude99 Coins: " + u.coins + "   \ud83c\udfc6 Wins: " + u.wins;
  $("#note").textContent = demo ? "Demo mode: data is saved in localStorage only." : "";
}

/* ===== Demo mode (only when Firebase cannot load, e.g. in a sandboxed preview) ===== */
function demoLogin(kind) {
  const guest = kind === "guest", uid = "demo_" + kind, old = ls.get("user");
  const same = old && old.uid === uid;
  const user = { uid, name: guest ? "Guest_DEMO" : "Demo Player", photo: AVATAR, isGuest: guest,
                 coins: same ? old.coins : 500, wins: same ? old.wins : 0 };
  ls.set("user", user);
  showHome(user, true);
}
</script>
</body>
</html>
