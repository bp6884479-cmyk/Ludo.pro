// ---------- Panels + dice (har color ka dice uske apne corner ke paas) ----------

// ---------- Game state ----------

function init(n){

function render(){

  })});
  for(const k in g){const n=g[k].length;g[k].forEach((o,j)=&gt;o.x+=(j-(n-1)/2)*.32)}
  L.forEach(o=&gt;{o.e.style.left=pc(o.x);o.e.style.top=pc(o.y)});
}

function ui(){

    PN[a].classList.toggle(&quot;on&quot;,act[a]&amp;&amp;a===turn&amp;&amp;!over);

}

function rollValue(){
  // sabke liye same rule: 6 ki chance zyada (28%), aur agar koi token bahar nahi hai to aur zyada (42%)
  const none=T[turn].every(t=&gt;t&lt;0);

function roll(){

function after(){

// ---------- Dice sound (synthesised, no audio files needed) ----------
let AC;
function ctx(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(AC.state===&quot;suspended&quot;)AC.resume();
  return AC;
}

document.addEventListener(&quot;pointerdown&quot;,ctx);
function clack(freq,vol,dur){
  const a=ctx();if(!a)return;
  const n=Math.max(1,a.sampleRate*dur|0),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i&lt;n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);

  s.connect(f);f.connect(g);g.connect(a.destination);s.start();
}

  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.16);
}
const tick=()=&gt;{if(Math.random()&lt;.85)clack(1600+Math.random()*2400,.25+Math.random()*.25,.03)};  // rattle while rolling
const land=()=&gt;{clack(1100,.7,.06);thump()};                                                       // final clack when it settles
// ---------- Computer player ----------
function pick(){
  let best=-1,bs=-1e9;
  movable().forEach(i=&gt;{
    const t=T[turn][i],nt=t&lt;0?0:t+D;let s=nt;
    if(t&lt;0)s+=40;

    }
    s+=Math.random();
    if(s&gt;bs){bs=s;best=i}
  });
  return best;
}
function kick(){
  clearTimeout(kt);
  if(over||busy||!bots[turn])return;
  kt=setTimeout(()=&gt;{if(!rolled)roll();else{const m=pick();if(m&gt;=0)move(m)}},950);
}
// ---------- Online sync (Firebase Realtime Database) ----------
function push(){
  if(!NET)return;seq++;

}
function apply(st){

  T=JSON.parse(st.T);turn=st.turn;D=st.D;rolled=!!st.rolled;over=!!st.over;busy=false;
  if(rolled){face(turn,D);land()}

  render();ui();
  if(over){$(&quot;#wt&quot;).innerHTML=`🎉 Congratulations!&lt;br&gt;&lt;small&gt;${PL[turn].n} won the game&lt;/small&gt;`;$(&quot;#win&quot;).hidden=false}
}
window.startGame=cfg=&gt;{
  window.stopGame();

};

$(&quot;#rs&quot;).onclick=$(&quot;#again&quot;).onclick=()=&gt;init();

/* Realtime Database: users/{uid}. created on first login. */

async function quick(tries = 0) {                       // quick 1v1 matchmaking
  const code = await createRoom(2, true); let take = null;
  await fb.d.runTransaction(fb.d.ref(fb.db, "queue2"), q => { take = q || null; return q ? null : code; });
  if (take) {
    await fb.d.remove(rr(code));
    try { await join(take); return; } catch (e) { if (tries < 2) return quick(tries + 1); throw e; }
  }
  waitRoom(code, "Finding an opponent…", true);
}
async function logout() {
  ls.del("user"); if (fb) { try { await fb.au.signOut(fb.auth); } catch (e) {} }
  closeModal(); $("#home").hidden = true; $("#login").hidden = false; setBusy(false);
}

/* ----- menus ----- */
$("#lbx").onclick = async e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, n = +b.dataset.n;
  try {
    if (a === "x") closeModal();
    else if (a === "bot") startGame({ mode: "bot", n });
    else if (a === "mk") { const c = await createRoom(n, false); waitRoom(c, "Room created. Share this code", true); }
    else if (a === "jn") await join($("#rc").value);
    else if (a === "cancel") await leave();
    else if (a === "logout") logout();
  } catch (err) { const le = $("#le"); if (le) le.textContent = err.message; else toast(err.message); }
};
const friends = () => need() && modal(`<b>Play with Friends</b><p>Create a room and share the code</p>
  <div class="row"><button data-a="mk" data-n="2">2 Players</button><button data-a="mk" data-n="3">3</button><button data-a="mk" data-n="4">4</button></div>
  <p>or join a friend's room</p><input id="rc" maxlength="4" placeholder="CODE" autocomplete="off">
  <button data-a="jn">Join Room</button><p id="le" style="color:#ffb4b4"></p><button data-a="x">Close</button>`);
$("#c-fr").onclick = $("#n-fr").onclick = friends;
$("#c-on").onclick = async () => {
  if (!need()) return;
  modal(`<b>Finding an opponent…</b><p>Please wait</p>`);
  try { await quick(); } catch (e) { modal(`<b>Could not start</b><p>${esc(e.message)}</p><button data-a="x">Close</button>`); }
};
$("#c-pc").onclick = () => modal(`<b>VS Computer</b><p>Choose how many bots to play against</p>
  <div class="row"><button data-a="bot" data-n="2">1 Bot</button><button data-a="bot" data-n="3">2 Bots</button><button data-a="bot" data-n="4">3 Bots</button></div><button data-a="x">Close</button>`);
$("#c-pp").onclick = () => startGame({ mode: "local", n: 4 });
$("#n-help").onclick = () => modal(`<b>How to play</b><p>Roll a 6 to bring a token out. Move around the board and reach the centre with an exact roll. Land on an opponent (not on ★ or start squares) to send it home. A 6, a capture or reaching home gives another turn. Bring all 4 tokens home first to win!</p><button data-a="x">Got it</button>`);
$("#n-inv").onclick = async () => {
  const d = { title: "Ludo Crush", text: "Play Ludo Crush with me!", url: location.href.split("#")[0] };
  try { if (navigator.share) await navigator.share(d); else { await navigator.clipboard.writeText(d.url); toast("Link copied!"); } } catch (e) {}
};
$("#gear").onclick = $("#n-pro").onclick = () => {
  const u = ls.get("user") || {};
  modal(`<b>${esc(u.name || "Player")}</b><p>${u.isGuest ? "Guest" : "Google"} account</p><button class="lo" data-a="logout">Log out</button><button data-a="x">Close</button>`);
};
</script>
