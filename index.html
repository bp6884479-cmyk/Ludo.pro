<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ludo Crush – Login</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--G:#2e9e3f;--Y:#fcd22f;--B:#1f8fe5;--R:#e32b2b}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background-color:#16358f;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 26px,transparent 26px 52px),repeating-linear-gradient(-45deg,rgba(0,0,0,.1) 0 26px,transparent 26px 52px);background-attachment:fixed}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 14px;background:transparent}
.G{--k:var(--G)}.Y{--k:var(--Y)}.B{--k:var(--B)}.R{--k:var(--R)}
.pin{position:relative;display:inline-block;width:30px;height:30px;margin:4px 7px}
.pin::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),transparent 50%),var(--k);border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:2px 2px 5px #0007}
.pin::after{content:"";position:absolute;left:28%;top:28%;width:44%;height:44%;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.pins{display:flex;animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
h1{margin:0;font-size:clamp(2.2rem,10vw,3.4rem);font-weight:900;letter-spacing:2px;text-shadow:0 4px 0 #0005;text-align:center;line-height:1.05}
h1 span:nth-child(1){color:var(--R)}h1 span:nth-child(2){color:var(--G)}h1 span:nth-child(3){color:var(--Y)}h1 span:nth-child(4){color:var(--B)}
.sub{margin:-6px 0 0;opacity:.85;font-weight:600;text-align:center}
.card{width:min(92vw,380px);padding:22px 20px;border:3px solid #e4b53a;border-radius:16px;background:linear-gradient(#2a58c4,#173a96);box-shadow:0 10px 26px #0008;display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.card[hidden],#demo[hidden],#go[hidden]{display:none}
button{font:inherit;font-weight:800;font-size:1.05rem;padding:14px 16px;border:0;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:inset 0 -4px 0 #0003,0 3px 6px #0005}
button:active{transform:translateY(2px)}
button:disabled{opacity:.55;cursor:wait}
.gg{background:#fff;color:#333}
.gs{background:#ffd54a;color:#222}
.out{background:transparent;color:#fff;box-shadow:none;border:2px solid #fff6;font-size:.95rem;padding:10px}
.or{display:flex;align-items:center;gap:10px;opacity:.8;font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:#fff6}
#err{margin:0;min-height:1.2em;color:#ffb4b4;font-weight:600;font-size:.9rem}
#demo{width:min(92vw,380px);margin:0;padding:10px 12px;border-radius:10px;background:#ffd54a;color:#222;font-size:.85rem;font-weight:600;text-align:center}
#av{width:84px;height:84px;border-radius:50%;border:4px solid #ffd54a;background:#fff;object-fit:cover;margin:0 auto}
#nm{margin:0;font-size:1.3rem}
#ty,#st,#note{margin:0;opacity:.9}
#st{font-weight:800;color:#ffd54a}
#note{font-size:.8rem}
</style>
</head>
<body>
<div class="pins"><i class="pin G"></i><i class="pin Y"></i><i class="pin B"></i><i class="pin R"></i></div>
<h1><span>L</span><span>U</span><span>D</span><span>O</span><br><span>C</span><span>R</span><span>U</span><span>S</span><span>H</span></h1>
<p class="sub">Play with friends and enjoy the win!</p>

<p id="demo" hidden>Preview mode: Firebase is blocked in this sandbox, so login is simulated locally. Host this file (or use localhost) for real Firebase login.</p>

<div class="card" id="login">
  <button class="gg" id="bg">
    <svg width="22" height="22" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    <span>Sign in with Google</span>
  </button>
  <div class="or">or</div>
  <button class="gs" id="bq"><span>👤 Play as Guest</span></button>
  <p id="err"></p>
</div>

<div class="card" id="home" hidden>
  <img id="av" alt="Profile">
  <h2 id="nm"></h2>
  <p id="ty"></p>
  <p id="st"></p>
  <button class="gs" id="go">🎲 Continue to Game</button>
  <p id="note"></p>
  <button class="out" id="lo">Log out</button>
</div>

<script>
/* ===== Settings ===== */
const GAME_PATH = "/game";                 // where to go after login
const firebaseConfig = {
  apiKey: "AIzaSyDFGtCMHWBH9ScOk2YUhk5iJjyh4ug9QSc",
  authDomain: "coinrush-pro-ef37b.firebaseapp.com",
  databaseURL: "https://coinrush-pro-ef37b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "coinrush-pro-ef37b",
  storageBucket: "coinrush-pro-ef37b.firebasestorage.app",
  messagingSenderId: "2523681309",
  appId: "1:2523681309:web:9bf3bf9164d948010cecf4"
};

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const AVATAR = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84"><rect width="84" height="84" fill="#fff"/><circle cx="42" cy="32" r="14" fill="#1f8fe5"/><path d="M14 78c0-18 12-26 28-26s28 8 28 26z" fill="#1f8fe5"/></svg>');
const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
const ERR = {
  "auth/popup-closed-by-user": "The sign-in window was closed. Please try again.",
  "auth/cancelled-popup-request": "The sign-in window was closed. Please try again.",
  "auth/popup-blocked": "Your browser blocked the popup. Allow popups and try again.",
  "auth/unauthorized-domain": "This domain is not authorized in Firebase (Authentication > Settings > Authorized domains).",
  "auth/operation-not-allowed": "This sign-in method is not enabled in Firebase Console (Google / Anonymous).",
  "auth/network-request-failed": "Network error. Check your internet and try again.",
  "auth/operation-not-supported-in-this-environment": "Open this page over http(s) or localhost, not file://."
};
const showErr = e => {
  const m = String(e && e.message || "");
  $("#err").textContent = ERR[e && e.code] ||
    (/permission_denied/i.test(m) ? "Database write denied. Check your Realtime Database rules." : "Login failed: " + ((e && e.code) || m));
};
const setBusy = b => { $("#bg").disabled = $("#bq").disabled = b; if (b) $("#err").textContent = ""; };

/* ===== Load Firebase (dynamic import so the buttons always work) ===== */
let fb = null, signingIn = false;
const CDN = "https://www.gstatic.com/firebasejs/10.12.2/";
const ready = (async () => {
  try {
    const [a, au, d] = await Promise.all([
      import(CDN + "firebase-app.js"),
      import(CDN + "firebase-auth.js"),
      import(CDN + "firebase-database.js")
    ]);
    const app = a.initializeApp(firebaseConfig);
    fb = { au, d, auth: au.getAuth(app), db: d.getDatabase(app) };
    au.onAuthStateChanged(fb.auth, onAuth);
  } catch (e) {
    console.warn("Firebase could not load, using demo mode:", e);
    $("#demo").hidden = false;
    const u = ls.get("user");
    if (u && String(u.uid).startsWith("demo_")) showHome(u, true);
  }
})();

/* ===== Save user in Realtime Database: users/{uid} ===== */
async function saveUser(u) {
  const guest = u.isAnonymous;
  const name = guest ? "Guest_" + u.uid.slice(-4).toUpperCase() : (u.displayName || "Player");
  const photo = (!guest && u.photoURL) || AVATAR;
  const r = fb.d.ref(fb.db, "users/" + u.uid);
  // Transaction: creates the user with coins=500, wins=0 only the first time; existing coins/wins are kept.
  const res = await fb.d.runTransaction(r, cur =>
    cur ? { ...cur, uid: u.uid, name, photo }
        : { uid: u.uid, name, photo, coins: 500, wins: 0 });
  return { ...res.snapshot.val(), isGuest: guest };
}
const finish = async u => {
  const data = await saveUser(u);
  ls.set("user", data);                    // save to localStorage
  location.href = GAME_PATH;               // redirect to /game
};

/* ===== Buttons ===== */
async function login(kind) {
  setBusy(true);
  await ready;
  if (!fb) { demoLogin(kind); setBusy(false); return; }
  signingIn = true;
  try {
    const cred = kind === "google"
      ? await fb.au.signInWithPopup(fb.auth, new fb.au.GoogleAuthProvider())
      : await fb.au.signInAnonymously(fb.auth);
    await finish(cred.user);
  } catch (e) {
    console.error(e); signingIn = false; showErr(e); setBusy(false);
  }
}
$("#bg").onclick = () => login("google");
$("#bq").onclick = () => login("guest");
$("#lo").onclick = async () => {
  ls.del("user");
  if (fb) { try { await fb.au.signOut(fb.auth); } catch (e) {} }
  $("#home").hidden = true; $("#login").hidden = false; setBusy(false);
};
$("#go").onclick = async () => {
  $("#go").disabled = true;
  try { await finish(fb.auth.currentUser); } catch (e) { $("#note").textContent = "Error: " + (e.code || e.message); $("#go").disabled = false; }
};

/* ===== Already signed in (returning visitor) ===== */
function onAuth(u) {
  if (signingIn || !u) return;
  showHome({ name: u.isAnonymous ? "Guest_" + u.uid.slice(-4).toUpperCase() : (u.displayName || "Player"),
             photo: (!u.isAnonymous && u.photoURL) || AVATAR, isGuest: u.isAnonymous });
}
function showHome(u, demo) {
  $("#login").hidden = true; $("#home").hidden = false;
  $("#nm").textContent = "Welcome, " + u.name + "!";
  $("#av").src = u.photo || AVATAR;
  $("#ty").textContent = u.isGuest ? "Playing as Guest" : "Signed in with Google";
  $("#st").textContent = demo ? "Coins: " + u.coins + "  ·  Wins: " + u.wins : "";
  $("#go").hidden = !!demo;
  $("#note").textContent = demo ? "Demo mode: saved in localStorage only. On a real host, login saves to Realtime Database and redirects to " + GAME_PATH + "." : "";
}

/* ===== Demo mode (only when Firebase cannot load, e.g. in a sandboxed preview) ===== */
function demoLogin(kind) {
  const guest = kind === "guest", uid = "demo_" + kind, old = ls.get("user");
  const same = old && old.uid === uid;
  const user = { uid, name: guest ? "Guest_DEMO" : "Demo Player", photo: AVATAR, isGuest: guest,
                 coins: same ? old.coins : 500, wins: same ? old.wins : 0 };
  ls.set("user", user);
  showHome(user, true);
}
</script>
</body>
</html>
